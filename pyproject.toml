[project]
name = "seikyu"
version = "0.1.0"
description = "発注書を入れると適格請求書(インボイス)を自動生成して保存するローカルツール"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "pypdf>=5.0",
    "jpholiday>=1.0",
]

[project.scripts]
seikyu = "seikyu.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seikyu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
